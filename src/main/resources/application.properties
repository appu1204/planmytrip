spring.application.name=planmytrip

# ─── Server ───────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ─── App ──────────────────────────────────────────────────
app.base-url=http://localhost:8080/api

# ─── Database ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/planmytrip?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2424
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-32-chars
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# ─── Security ─────────────────────────────────────────────────
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30

# ─── Token Expiry ─────────────────────────────────────────────────
app.token.password-reset-expiry-minutes=15
app.token.email-verification-expiry-hours=24
app.token.otp-expiry-minutes=5

# ─── Mail ─────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=appukumar1204@gmail.com
spring.mail.password=wdmqgoujgszfdfma
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Logging ─────────────────────────────────────────────────
logging.level.com.planmytrip=DEBUG
logging.level.org.springframework.security=INFO

